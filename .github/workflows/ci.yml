name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, offline tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/jev_browser_py
      - name: Offline tests (no API key, no network, no browser)
        run: python -m pytest -q -m "not browser" --ignore=tests/test_e2e_local.py

  browser:
    name: local Chromium E2E (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Local fixture E2E
        run: python -m pytest -q tests/test_e2e_local.py -m browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

  package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Import smoke test from the wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import jev_browser_py as j; print(j.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
