[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-browser-py"
version = "1.0.0"
description = "Python-native, judgment-gated browser agent inspired by Jev Browser, with Scrapling extraction."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "jev-browser-py contributors" }]
keywords = ["browser-automation", "agents", "playwright", "jev", "scrapling"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "pydantic>=2.12,<3",
  "playwright>=1.49,<2",
  "typesafe-sdk>=0.7.5,<0.8",
  "scrapling>=0.5.1,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "ruff>=0.6",
  "mypy>=1.13",
]

[project.scripts]
jev-browser = "jev_browser_py.cli:main"

[project.urls]
Documentation = "https://github.com/choko510/jev-browser-py"
Repository = "https://github.com/choko510/jev-browser-py"
Issues = "https://github.com/choko510/jev-browser-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_browser_py"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "examples", "scripts"]
extend-exclude = ["IMPLEMENTATION_GUIDE.md", "docs", "README.md", "AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "ASYNC", "S", "DTZ", "PIE", "RET", "PERF", "BLE"]
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S105",
  "S106",
  "S311",
  "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "DTZ", "B011", "ASYNC109"]
"scripts/*" = ["S", "T20"]
"src/jev_browser_py/cli.py" = ["T20"]
"src/jev_browser_py/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["jev_browser_py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
files = ["src/jev_browser_py"]
plugins = []

[[tool.mypy.overrides]]
module = ["scrapling.*", "typesafe_sdk.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -p no:xonsh"
markers = [
  "browser: uses a real local Playwright Chromium instance",
  "network: uses a local loopback HTTP server only",
]

[tool.coverage.run]
source = ["src/jev_browser_py"]
